[package]
name = "bat-git"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
bat-host-support = { path = "../bat-host-support", default-features = false, features = ["process-tree"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
