[package]
name = "bat-session-index"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
bat-host-support = { path = "../bat-host-support", default-features = false, features = ["process-tree"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(windows))'.dependencies]
trash = "5.2.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
windows-core = "0.62"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_WindowsProgramming"] }

[target.'cfg(windows)'.dev-dependencies]
trash = "5.2.9"
